services:
  api:
    build: ./InventoryAnalyzerAPI
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5122:8080"
    restart: unless-stopped

  web:
    build:
      context: ./InventoryAnalyzerWeb
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_URL: http://api:8080
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
